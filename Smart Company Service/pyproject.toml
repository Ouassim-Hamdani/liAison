[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "chromadb>=1.4.1",
    "docling>=2.71.0",
    "langchain>=1.2.7",
    "langchain-chroma>=1.1.0",
    "langchain-huggingface>=1.2.0",
    "langchain-openai>=1.1.7",
    "pydantic>=2.12.5",
    "python-dotenv>=1.2.1",
    "sentence-transformers>=5.2.2",
    "smolagents[openai]>=1.24.0",
    "streamlit>=1.53.1",
]

[tool.setuptools]
packages = {find = {where = ["src"]}}

[tool.uv]
# This tells uv to treat the current directory as an editable install
dev-dependencies = [
    "backend"
]
